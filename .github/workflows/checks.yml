name: ReqDoc updater pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/reqdoc_updater.py"
      - "updater.ps1"
      - "scripts/build_update.py"
      - "tests/test_updater_release.py"
      - ".github/workflows/checks.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reqdoc-updater-pipeline
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q src scripts

      - name: Validate PowerShell updater syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'updater.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            exit 1
          }

      - name: Run regression and updater tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m unittest discover -v -s tests -p "test_*.py"

      - name: Build and validate updater bootstrap package
        shell: pwsh
        run: python scripts/build_update.py --output-dir dist

      - name: Preserve build output for publish job
        uses: actions/upload-artifact@v4
        with:
          name: reqdoc-update-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-update-feed:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate-and-build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve validated update bundle
        uses: actions/download-artifact@v4
        with:
          name: reqdoc-update-bundle
          path: dist

      - name: Publish persistent update feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const packageName = fs.readdirSync('dist').find(name => /^reqdoc-update-v\d+\.\d+\.\d+\.zip$/.test(name));
            if (!packageName) throw new Error('Validated updater ZIP is missing');
            const packageBytes = fs.readFileSync('dist/' + packageName);
            const manifestText = fs.readFileSync('dist/latest.json', 'utf8');
            const manifest = JSON.parse(manifestText);

            function compareVersions(a, b) {
              const left = a.split('.').map(Number);
              const right = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (left[i] !== right[i]) return left[i] - right[i];
              }
              return 0;
            }

            let branchExists = false;
            let parentSha;
            let baseTreeSha;
            try {
              const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/updates'});
              branchExists = true;
              parentSha = ref.data.object.sha;
              const parent = await github.rest.git.getCommit({owner, repo, commit_sha: parentSha});
              baseTreeSha = parent.data.tree.sha;
              try {
                const oldFile = await github.rest.repos.getContent({owner, repo, path: 'latest.json', ref: 'updates'});
                const oldManifest = JSON.parse(Buffer.from(oldFile.data.content, 'base64').toString('utf8'));
                if (compareVersions(manifest.version, oldManifest.version) <= 0) {
                  throw new Error('APP_VERSION must increase before publishing a new updater package');
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!branchExists) {
              parentSha = context.sha;
              const parent = await github.rest.git.getCommit({owner, repo, commit_sha: parentSha});
              baseTreeSha = parent.data.tree.sha;
            }

            const packageBlob = await github.rest.git.createBlob({
              owner, repo, encoding: 'base64', content: packageBytes.toString('base64')
            });
            const manifestBlob = await github.rest.git.createBlob({
              owner, repo, encoding: 'utf-8', content: manifestText
            });
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: baseTreeSha,
              tree: [
                {path: packageName, mode: '100644', type: 'blob', sha: packageBlob.data.sha},
                {path: 'latest.json', mode: '100644', type: 'blob', sha: manifestBlob.data.sha}
              ]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'Publish ReqDoc updater bootstrap ' + manifest.version,
              tree: tree.data.sha,
              parents: [parentSha]
            });

            if (branchExists) {
              await github.rest.git.updateRef({owner, repo, ref: 'heads/updates', sha: commit.data.sha, force: false});
            } else {
              await github.rest.git.createRef({owner, repo, ref: 'refs/heads/updates', sha: commit.data.sha});
            }
            core.setOutput('published-version', manifest.version);
